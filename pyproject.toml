[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-safe-marl"
version = "0.1.0"
description = "Modular experiment platform for P2P UAV Safe MARL"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "PyYAML>=6.0", "gymnasium>=1.0"]

[project.scripts]
uav-safe-marl = "uav_safe_marl.__main__:main"

[project.optional-dependencies]
learn = ["torch>=2.2", "tensorboard>=2.16", "tqdm>=4.66"]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6", "nbconvert>=7", "ipywidgets>=8"]
verify = ["cvxpy>=1.5"]

[tool.setuptools.packages.find]
include = ["uav_safe_marl*"]

[tool.setuptools.package-data]
uav_safe_marl = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
